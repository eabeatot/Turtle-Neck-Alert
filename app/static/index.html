<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/static/favicon.svg"><title>거북목·자세 교정 도우미</title><link rel="stylesheet" href="/static/style.css"></head><body><main><div class="top"><h1>거북목·자세 교정 도우미</h1><span id="appState" class="state idle">대기</span></div><p class="notice">의료 기기가 아니며 판정은 추정치입니다. 웹캠 영상은 서버에 전송·저장하지 않습니다.</p><section class="camera"><div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div id="detect">사람 감지 안 됨</div><div id="fps">0 FPS</div></div><button id="camera">카메라 시작</button><p id="guidance">카메라를 시작하면 인식 상태가 표시됩니다.</p></section><section><h2>데이터 수집</h2><p>각 라벨 최소 <b id="minimum">10</b>개 필요 · 바른 자세 <b id="goodCount">0</b>개 · 나쁜 자세 <b id="badCount">0</b>개</p><button data-label="good">바른 자세 녹화</button><button data-label="bad">나쁜 자세 녹화</button><div class="data-actions"><button id="deleteData">학습자료 삭제</button><button id="deleteModels">모델 삭제</button></div><p id="recordStatus">녹화 대기</p></section><section><h2>모델 학습</h2><button id="train" disabled>모델 학습하기</button><p id="trainStatus">데이터를 먼저 수집하세요.</p></section><section><h2>실시간 판정</h2><div id="result" class="result unknown">판정 불가</div><p>신뢰도: <b id="confidence">-</b> · 상태 지속: <b id="duration">0초</b></p><p>나쁜 자세 알림까지: <b id="alarmRemaining">-</b></p><label>경고 기준(초) <input id="delay" type="number" value="10" min="1"></label><p id="drift"></p></section><p class="help">귀와 양쪽 어깨가 화면 안에 보이도록 카메라를 정면에 두세요.</p></main><script type="module" src="/static/app.js"></script><script>setTimeout(()=>{const b=document.querySelector('#camera'),v=document.querySelector('#video'),g=document.querySelector('#guidance');if(!b.onclick)b.onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});v.srcObject=s;await v.play();g.textContent='카메라 연결됨. MediaPipe를 불러오지 못했습니다.'}catch(e){g.textContent='카메라 시작 실패: '+e.message}};for(const [id,url,msg] of [['deleteData','/api/data','학습자료'],['deleteModels','/api/models','모델']])document.querySelector('#'+id).onclick=async()=>{if(confirm(msg+'를 모두 삭제할까요?')){const r=await fetch(url,{method:'DELETE'});document.querySelector('#recordStatus').textContent=r.ok?msg+' 삭제 완료':'삭제 실패'}}},600)</script></body></html>
