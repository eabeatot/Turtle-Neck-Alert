name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${DOCKERHUB_USERNAME:-${GITHUB_REPOSITORY_OWNER}}/turtle-neck-alert" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Container smoke test
        run: |
          docker run -d --name posture -p 8000:8000 -v posture-data:/app/data ${{ steps.image.outputs.name }}:${{ github.sha }}
          for i in $(seq 1 20); do curl --fail http://localhost:8000/health && break || sleep 1; done
          python - <<'PY'
          import json, urllib.request
          points=[{"index":i,"x":.5,"y":.3+i*.01,"z":0} for i in range(33)]
          req=urllib.request.Request('http://localhost:8000/api/predict', json.dumps({'points':points}).encode(), {'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req) as response: assert response.status == 200
          PY

  deploy-self-hosted:
    needs: test-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy latest image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/turtle-neck-alert:${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull $env:IMAGE
          docker rm -f turtle-neck-alert 2>$null; if ($LASTEXITCODE -ne 0) { $LASTEXITCODE = 0 }
          docker run -d --name turtle-neck-alert --restart unless-stopped -p 8000:8000 -v turtle-neck-alert-data:/app/data $env:IMAGE
      - name: Verify deployed service
        run: |
          $ErrorActionPreference = 'Stop'
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8000/health | ConvertTo-Json -Compress; exit 0 } catch { Start-Sleep -Seconds 2 }
          }
          docker logs turtle-neck-alert
          exit 1
