name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set image name
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "name=${DOCKERHUB_USERNAME:-${GITHUB_REPOSITORY_OWNER}}/turtle-neck-alert" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: true
          build-args: COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:latest,${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Container smoke test
        run: |
          docker run -d --name posture -p 8000:8000 -v posture-data:/app/data ${{ steps.image.outputs.name }}:${{ github.sha }}
          for i in $(seq 1 20); do curl --fail http://localhost:8000/health && break || sleep 1; done
          python - <<'PY'
          import json, urllib.request
          points=[{"index":i,"x":.5,"y":.3+i*.01,"z":0} for i in range(33)]
          req=urllib.request.Request('http://localhost:8000/api/predict', json.dumps({'points':points}).encode(), {'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req) as response: assert response.status == 200
          PY

  deploy-self-hosted:
    needs: test-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull latest image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/turtle-neck-alert:${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'tna-blue-green'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -LiteralPath (Join-Path $root 'phase') -Value 'before' -Encoding utf8
          Remove-Item -LiteralPath (Join-Path $root 'stop') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $root 'predict.jsonl') -Force -ErrorAction SilentlyContinue
          $monitor = Join-Path $env:GITHUB_WORKSPACE 'scripts\monitor-predict.ps1'
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$monitor,'-Output',(Join-Path $root 'predict.jsonl'),'-PhaseFile',(Join-Path $root 'phase'),'-StopFile',(Join-Path $root 'stop'))
          $pullOutput = @(docker pull $env:IMAGE 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed: $($pullOutput -join ' ')" }
      - name: Start new color
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/turtle-neck-alert:${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'tna-blue-green'
          $network = 'tna-net'; $volume = 'turtle-neck-alert-data'
          $networkExists = @(docker network ls --filter "name=^$network$" --format '{{.Name}}' 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "cannot list Docker networks: $($networkExists -join ' ')" }
          if ($networkExists.Count -eq 0) {
            $networkOutput = @(docker network create $network 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "docker network create failed: $($networkOutput -join ' ')" }
          }
          $legacy = docker ps -a --filter 'name=^turtle-neck-alert$' --format '{{.Names}}'
          if ($legacy) {
            $removeOutput = @(docker rm -f turtle-neck-alert 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot remove legacy container: $($removeOutput -join ' ')" }
            $forcedBlue = $true
          } else { $forcedBlue = $false }
          $active = $null
          if (-not $forcedBlue -and (docker ps --filter 'name=^tna-proxy$' --format '{{.Names}}')) {
            $confOutput = @(docker exec tna-proxy cat /etc/nginx/conf.d/default.conf 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot read proxy config: $($confOutput -join ' ')" }
            $conf = $confOutput -join "`n"
            if ($conf -match 'tna-(blue|green):8000') { $active = $Matches[1] }
            $inspectOutput = @(docker inspect tna-proxy 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot inspect proxy: $($inspectOutput -join ' ')" }
            $mounts = $inspectOutput -join "`n" | ConvertFrom-Json
            $bindMount = @($mounts[0].Mounts | Where-Object { $_.Type -eq 'bind' -and $_.Destination -eq '/etc/nginx/conf.d' })
            if ($bindMount.Count -gt 0) {
              $removeOutput = @(docker rm -f tna-proxy 2>&1)
              if ($LASTEXITCODE -ne 0) { throw "cannot recreate proxy: $($removeOutput -join ' ')" }
              $recreateProxy = $true
            } else { $recreateProxy = $false }
          } else {
            $recreateProxy = $false
          }
          if (-not $active -and -not $forcedBlue) {
            foreach ($color in @('blue','green')) { if (docker ps --filter "name=^tna-$color$" --format '{{.Names}}') { $active = $color; break } }
          }
          if (-not $active) { $active = 'blue' }
          $new = if ($active -eq 'blue') { 'green' } else { 'blue' }
          $old = if ($active -eq 'blue') { 'blue' } else { 'green' }
          $name = "tna-$new"
          $existingNew = @(docker ps -a --filter "name=^$name$" --format '{{.Names}}')
          if ($existingNew.Count -gt 0) {
            $removeOutput = @(docker rm -f $name 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot remove old $name: $($removeOutput -join ' ')" }
          }
          $runOutput = @(docker run -d --name $name --restart unless-stopped --network $network --network-alias $name -v "${volume}:/app/data" $env:IMAGE 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "cannot start $name: $($runOutput -join ' ')" }
          @("new=$new","old=$old","recreateProxy=$recreateProxy") | Set-Content -LiteralPath (Join-Path $root 'state') -Encoding utf8
          Set-Content -LiteralPath (Join-Path $root 'phase') -Value 'during' -Encoding utf8
      - name: Wait for healthy
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/turtle-neck-alert:${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'tna-blue-green'; $state = Get-Content (Join-Path $root 'state')
          $new = ($state | Where-Object { $_ -like 'new=*' }).Split('=')[1]; $name = "tna-$new"
          $healthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            $statusOutput = @(docker inspect --format '{{.State.Health.Status}}' $name 2>&1)
            if ($LASTEXITCODE -ne 0) { $status = 'missing' } else { $status = ($statusOutput -join '').Trim() }
            if ($status -eq 'healthy') { $healthy = $true; break }
            if ($status -eq 'unhealthy') { break }
            Start-Sleep -Seconds 2
          }
          if (-not $healthy) {
            $logs = @(docker logs $name 2>&1); $removeOutput = @(docker rm -f $name 2>&1)
            throw "new container did not become healthy: $($logs -join ' ')"
          }
          $modelOutput = @(docker exec $name python -c "import urllib.request,json; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['active_model']['version'])" 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "cannot read model version: $($modelOutput -join ' ')" }
          $model = ($modelOutput -join '').Trim()
          "model=$model" | Add-Content -LiteralPath (Join-Path $root 'state') -Encoding utf8
      - name: Switch traffic
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'tna-blue-green'; $state = Get-Content (Join-Path $root 'state')
          $new = ($state | Where-Object { $_ -like 'new=*' }).Split('=')[1]
          $conf = "server {`n    listen 8000;`n    location / {`n        proxy_pass http://tna-$new`:8000;`n        proxy_http_version 1.1;`n        proxy_set_header Host `$host;`n        proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;`n    }`n}`n"
          $configFile = Join-Path $root 'default.conf'; [System.IO.File]::WriteAllText($configFile, $conf, [System.Text.UTF8Encoding]::new($false))
          if (-not (docker ps --filter 'name=^tna-proxy$' --format '{{.Names}}')) {
            $proxyOutput = @(docker run -d --name tna-proxy --restart unless-stopped --network tna-net -p 8000:8000 nginx:alpine 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot start proxy: $($proxyOutput -join ' ')" }
            Start-Sleep -Seconds 2
            $copyOutput = @(docker cp (Join-Path $env:GITHUB_WORKSPACE 'nginx\default.conf') tna-proxy:/etc/nginx/conf.d/default.conf 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot copy initial proxy config: $($copyOutput -join ' ')" }
          }
          $copyOutput = @(docker cp $configFile tna-proxy:/etc/nginx/conf.d/default.conf 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "cannot copy proxy config: $($copyOutput -join ' ')" }
          $testOutput = @(docker exec tna-proxy nginx -t 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "nginx config test failed: $($testOutput -join ' ')" }
          $reloadOutput = @(docker exec tna-proxy nginx -s reload 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "nginx reload failed: $($reloadOutput -join ' ')" }
          Set-Content -LiteralPath (Join-Path $root 'phase') -Value 'after-switch' -Encoding utf8
      - name: Stop old color
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'tna-blue-green'; $state = Get-Content (Join-Path $root 'state')
          $old = ($state | Where-Object { $_ -like 'old=*' }).Split('=')[1]; Start-Sleep -Seconds 5
          $oldName = "tna-$old"; $existingOld = @(docker ps -a --filter "name=^$oldName$" --format '{{.Names}}')
          if ($existingOld.Count -gt 0) {
            $removeOutput = @(docker rm -f $oldName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "cannot remove $oldName: $($removeOutput -join ' ')" }
          }
          Start-Sleep -Seconds 15
          New-Item -ItemType File -Force -Path (Join-Path $root 'stop') | Out-Null
      - name: Zero-downtime check
        env:
          EXPECTED_APP: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'tna-blue-green'; $file = Join-Path $root 'predict.jsonl'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $file); $i++) { Start-Sleep -Milliseconds 200 }
          $rows = if (Test-Path $file) { Get-Content $file | Where-Object { $_ } | ConvertFrom-Json } else { @() }
          $state = Get-Content (Join-Path $root 'state'); $expectedModel = ($state | Where-Object { $_ -like 'model=*' }).Split('=')[1]
          $summary = @("## Zero-downtime deployment", "", "| 구간 | 요청 | 성공 | 실패 | 응답 버전 |", "|---|---:|---:|---:|---|")
          $failed = $false
          foreach ($phase in @('before','during','after-switch')) {
            $part = @($rows | Where-Object { $_.phase -eq $phase }); $success = @($part | Where-Object { $_.ok -eq $true }); $errors = $part.Count - $success.Count
            $versions = @($success | ForEach-Object { "$($_.app_version) / $($_.model_version)" } | Sort-Object -Unique) -join '<br>'
            $summary += "| $phase | $($part.Count) | $($success.Count) | $errors | $versions |"
            if ($errors -gt 0) { $failed = $true }
          }
          $last = @($rows | Select-Object -Last 1)
          if (-not $last -or -not $last.ok -or $last.app_version -ne $env:EXPECTED_APP -or $last.model_version -ne $expectedModel) { $failed = $true }
          $summary += ""; $summary += "Expected app: $env:EXPECTED_APP; expected model: $expectedModel"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ($failed) { throw 'zero-downtime verification failed' }
